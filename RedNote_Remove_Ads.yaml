name: "RedNote 去广告"
description: "适配 RedNote 国际版 9.44：清理开屏、信息流、搜索推广和界面广告；兼容小红书国内接口。"
author: "Minis"
homepage: "https://github.com/patrickyanxxxxx/rednote-egern"
icon: "xmark.shield.fill"

rules:
  - domain:
      match: "ads-img-al.xhscdn.com"
      policy: REJECT
  - domain:
      match: "ads-img-qc.xhscdn.com"
      policy: REJECT
  - domain:
      match: "ads-video-al.xhscdn.com"
      policy: REJECT
  - domain:
      match: "ads-video-qc.xhscdn.com"
      policy: REJECT
  - domain:
      match: "t-ads.xiaohongshu.com"
      policy: REJECT
  - url_regex:
      match: "^https://referee\\.(?:rnote|xiaohongshu)\\.com/v\\d+/stateReport(?:\\?|$)"
      policy: REJECT
  - url_regex:
      match: "^https?://(?:www\\.)?xhslink\\.com/o/"
      policy: REJECT

map_locals:
  - match: "^https://(?:edith|www)\\.(?:rnote|xiaohongshu)\\.com/api/(?:sns/v1/surprisebox/(?:get_style|open|submit_action)|marketing/box/trigger)(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "application/json"
    body: "{}"
  - match: "^https://(?:edith|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/(?:v\\d+/guide/user_banner|v\\d+/note/guide|v\\d+/ads/resource|v\\d+/tag/ads_engage|v\\d+/ads/apple/record|v\\d+/hey/[^/]+/hey_gallery)(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "application/json"
    body: "{}"
  - match: "^https://(?:ci\\.)?(?:rnote|xiaohongshu)\\.com/system_config/watermark(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "image/gif"
    body: ""
  - match: "^https://(?:edith|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v1/system(?:/|_)config/watermark(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "image/gif"
    body: ""
  - match: "^https://(?:pages\\.)?(?:rnote|xiaohongshu)\\.com/data/native/matrix_switches(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "application/json"
    body: "{}"

scriptings:
  - http_response:
      name: "信息流广告、相关搜索和音乐净化"
      match: "^https://(?:edith|rec|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v\\d+/(?:homefeed|followfeed|user/followings/followfeed|recommend/user/follow_recommend)"
      script_url: "https://raw.githubusercontent.com/patrickyanxxxxx/rednote-egern/main/scripts/feed_ads.js"
      body_required: true
      max_size: 8388608
      timeout: 10
  - http_response:
      name: "搜索页净化"
      match: "^https://(?:edith|so)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v\\d+/search/"
      script_url: "https://raw.githubusercontent.com/patrickyanxxxxx/rednote-egern/main/scripts/search.js"
      body_required: true
      max_size: 4194304
      timeout: 10
  - http_response:
      name: "开屏和界面配置净化"
      match: "^https://edith\\.(?:rnote|xiaohongshu)\\.com/api/sns/v\\d+/(?:system(?:_service)?/|note/widgets)"
      script_url: "https://raw.githubusercontent.com/patrickyanxxxxx/rednote-egern/main/scripts/system.js"
      body_required: true
      max_size: 4194304
      timeout: 10
  - http_response:
      name: "笔记和评论内容净化"
      match: "^https://(?:edith|rec|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v\\d+/(?:note/(?:detailfeed(?:\\?|$)|feed(?:\\?|$)|imagefeed(?:\\?|$)|videofeed(?:\\?|$)|live_photo/save(?:\\?|$)|comment(?:/|\\?|$))|interaction/comment(?:/|\\?|$))"
      script_url: "https://raw.githubusercontent.com/patrickyanxxxxx/rednote-egern/main/scripts/note.js"
      body_required: true
      max_size: 8388608
      timeout: 10
  - http_response:
      name: "私信页推荐用户净化"
      match: "^https://(?:edith|lng|www)\\.(?:rnote|xiaohongshu)\\.com/(?:api/(?:sns/)?v?\\d*/?)?(?:message|messages|chat|im|inbox|conversation|conversations)(?:/|\\?|$)"
      script_url: "https://raw.githubusercontent.com/patrickyanxxxxx/rednote-egern/main/scripts/messages.js"
      body_required: true
      max_size: 4194304
      timeout: 10

mitm:
  hostnames:
    includes:
      - "edith.rnote.com"
      - "rec.rnote.com"
      - "www.rnote.com"
      - "ci.rnote.com"
      - "so.rnote.com"
      - "lng.rnote.com"
      - "edith.xiaohongshu.com"
      - "rec.xiaohongshu.com"
      - "www.xiaohongshu.com"
      - "ci.xiaohongshu.com"
      - "so.xiaohongshu.com"
      - "lng.xiaohongshu.com"
      - "pages.rnote.com"
      - "pages.xiaohongshu.com"
      - "referee.rnote.com"
      - "referee.xiaohongshu.com"
