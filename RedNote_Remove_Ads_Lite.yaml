name: "RedNote 去广告 Lite"
description: "RedNote 国际版轻量去广告：保留广告过滤、视频快路径、组件净化、IP 属地及图片/视频无水印保存；绕过评论和私信的重型响应改写。"
author: "Minis"
homepage: "https://github.com/patrickyanxxxxx/rednote-egern"
icon: "xmark.shield.fill"

rules:
  - domain:
      match: "ads-img-al.xhscdn.com"
      policy: REJECT
  - domain:
      match: "ads-img-qc.xhscdn.com"
      policy: REJECT
  - domain:
      match: "ads-video-al.xhscdn.com"
      policy: REJECT
  - domain:
      match: "ads-video-qc.xhscdn.com"
      policy: REJECT
  - domain:
      match: "t-ads.xiaohongshu.com"
      policy: REJECT
  - domain:
      match: "ads-i2.xhscdn.com"
      policy: REJECT
  - domain:
      match: "ads-i3.xhscdn.com"
      policy: REJECT
  - domain:
      match: "trace.rtbasia.com"
      policy: REJECT
  - domain:
      match: "splash-online-decision.xiaohongshu.com"
      policy: REJECT
  - url_regex:
      match: "^https://referee\\.(?:rnote|xiaohongshu)\\.com/v\\d+/(?:stateReport|third/collect)(?:\\?|$)"
      policy: REJECT
  - url_regex:
      match: "^https?://(?:www\\.)?xhslink\\.com/o/"
      policy: REJECT

map_locals:
  - match: "^https://(?:edith|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v2/system_service/splash_config(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "application/json"
    body: '{"code":0,"success":true,"msg":"成功","data":{"bidding_ads":[],"ads_groups":[],"per_day_max_show":0}}'
  - match: "^https://(?:edith|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v2/system_service/splash_(?:async_optimization|online_decision)(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "application/json"
    body: '{"code":0,"success":true,"msg":"成功","data":{"track_url":"","ads_id":"-1","track_id":"","request_id":""}}'
  - match: "^https://(?:edith|www)\\.(?:rnote|xiaohongshu)\\.com/api/(?:sns/v1/surprisebox/(?:get_style|open|submit_action)|marketing/box/trigger)(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "application/json"
    body: "{}"
  - match: "^https://(?:edith|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/(?:v\\d+/guide/user_banner|v\\d+/note/guide|v\\d+/ads/resource|v\\d+/tag/ads_engage|v\\d+/ads/apple/record|v\\d+/hey/[^/]+/hey_gallery)(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "application/json"
    body: "{}"
  - match: "^https://(?:ci\\.)?(?:rnote|xiaohongshu)\\.com/system_config/watermark(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "image/gif"
    body: ""
  - match: "^https://(?:edith|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v1/system(?:/|_)config/watermark(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "image/gif"
    body: ""
  - match: "^https://(?:pages\\.)?(?:rnote|xiaohongshu)\\.com/data/native/matrix_switches(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "application/json"
    body: "{}"
  - match: "^https://(?:edith|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v\\d+/content/video/get_ads_info(?:\\?|$)"
    status_code: 200
    headers:
      Content-Type: "application/json"
    body: "{}"

scriptings:
  - http_response:
      name: "消息页推荐与推广净化"
      match: "^https://(?:edith|www)\\.(?:rnote|xiaohongshu)\\.com/api/(?:sns/v1/im/get_recent_chats|sns/v\\d+/message/detect)(?:\\?|$)"
      script_url: "https://raw.githubusercontent.com/patrickyanxxxxx/rednote-egern/main/scripts/message_recent_chats_filter.js"
      body_required: true
      max_size: 1048576
      timeout: 5
  - http_response:
      name: "首页和关注流广告净化"
      match: "^https://(?:edith|rec|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v\\d+/(?:homefeed|followfeed|user/followings/followfeed|recommend/user/follow_recommend)"
      script_url: "https://raw.githubusercontent.com/patrickyanxxxxx/rednote-egern/main/scripts/feed_ads_lite_v2.js"
      body_required: true
      max_size: 8388608
      timeout: 10
  - http_response:
      name: "视频流广告净化"
      match: "^https://(?:edith|rec|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v\\d+/note/videofeed(?:\\?|$)"
      script_url: "https://raw.githubusercontent.com/patrickyanxxxxx/rednote-egern/main/scripts/videofeed_ads_fast_v2.js"
      body_required: true
      max_size: 8388608
      timeout: 10
  - http_response:
      name: "笔记展示字段和去水印"
      match: "^https://(?:edith|rec|www)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v\\d+/note/(?:detailfeed|feed|imagefeed)(?:\\?|$)"
      script_url: "https://raw.githubusercontent.com/patrickyanxxxxx/rednote-egern/main/scripts/note_display_lite_v2.js"
      body_required: true
      max_size: 4194304
      timeout: 10
  - http_response:
      name: "笔记组件净化"
      match: "^https://(?:edith|rec|www|pages)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v\\d+/note/widgets(?:\\?|$)"
      script_url: "https://raw.githubusercontent.com/patrickyanxxxxx/rednote-egern/main/scripts/widgets_lite_v2.js"
      body_required: true
      max_size: 1048576
      timeout: 5
  - http_response:
      name: "搜索广告组件净化"
      match: "^https://(?:edith|so|search)\\.(?:rnote|xiaohongshu)\\.com/api/sns/v\\d+/search/"
      script_url: "https://raw.githubusercontent.com/patrickyanxxxxx/rednote-egern/main/scripts/search_ads_lite.js"
      body_required: true
      max_size: 4194304
      timeout: 10

mitm:
  hostnames:
    includes:
      - "edith.rnote.com"
      - "rec.rnote.com"
      - "www.rnote.com"
      - "ci.rnote.com"
      - "so.rnote.com"
      - "search.rnote.com"
      - "edith.xiaohongshu.com"
      - "rec.xiaohongshu.com"
      - "www.xiaohongshu.com"
      - "ci.xiaohongshu.com"
      - "so.xiaohongshu.com"
      - "search.xiaohongshu.com"
      - "pages.rnote.com"
      - "pages.xiaohongshu.com"
      - "referee.rnote.com"
      - "referee.xiaohongshu.com"
